# autobuilder_config_v1.yaml
# Runtime configuration for auto-builder.py (format v1).
#
# Usage:
#   autobuilderclaude.py --input plan.md --config this_file.yaml
#
# Copy this file, fill in all required fields, and pass it via --config.
# Values here override any matching key in the plan's ## Build Config block.
# Remove comments from production copies if desired.
#
# INSTRUCTIONS FOR THE CLAUDE INSTANCE WRITING A CONFIG:
#   Replace every <PLACEHOLDER> with a real absolute path or value.
#   All paths must be absolute. Relative paths are not supported.
#   Remove this comment block from the production file.

# ---------------------------------------------------------------------------
# Required
# ---------------------------------------------------------------------------

# Absolute path to the project repository root.
# claude receives "Working directory: {repo}" as the first line of every prompt.
repo: <absolute path to repo root>

# Directory for build logs. Created automatically if it does not exist.
# Recommended: one level above the repo (sibling directory).
# Example: if repo is /home/user/project, use /home/user/tmp_build_logs
# If omitted, default: ../tmp_build_logs relative to the plan file.
log_dir: <absolute path to log directory>

# ---------------------------------------------------------------------------
# Optional
# ---------------------------------------------------------------------------

# Additional directories to grant claude read/write access via --add-dir.
# Use when tasks must access files outside the repo directory (e.g. a
# shared project memory directory). Each entry is passed as a separate
# --add-dir flag. Omit or set to [] if not needed.
add_dirs: []
#  - /absolute/path/to/extra/dir

# Path to a plain-text file containing the license header to prepend to
# new source files. The builder instructs claude to use this header verbatim.
# Set to null or omit to skip license header injection.
license_file: <absolute path to LICENSE_HEADER.txt or null>

# Text injected into every task prompt after "Working directory:" and before
# the task body. Use to set agent behavior that applies to all tasks.
# Common use: instruct the agent to complete all steps without asking questions.
# Set to "" or omit to skip.
preamble: |
  Complete ALL steps in this task without asking for confirmation.
  Do not stop mid-task to ask "Continue?" or "Shall I proceed?".
  Apply all renames, writes, and changes as directed. Report results when done.

# Tools claude is allowed to use, passed via --allowedTools. Set to null or
# omit to use the built-in default: ['Bash', 'Edit', 'Read', 'Write'].
allowed_tools: null
# allowed_tools:
#   - Bash
#   - Edit
#   - Read
#   - Write
#   - mcp__GhidraMCP__*

# Default model when a task's Model: field is absent or unrecognized.
# Must be one of the keys in the models dict below, or a full model ID.
default_model: sonnet

# Effort level passed to claude via --effort (low|medium|high|xhigh|max).
# Set to null or omit to use claude's default. Command-line --effort overrides this.
effort: null

# Default allowed execution time window, applied to every task that has no
# per-task ExecWindow: field. Format per entry: "[DAY[,DAY...] ]HH:MM-HH:MM [TZ]",
# entries separated by ";". TZ is an IANA zone (America/Chicago) or abbreviation
# (CDT/CST/UTC); omitted TZ defaults to UTC. start>end wraps past midnight.
# Day abbreviations (case-insensitive): Mo Tu We Th Fr Sa Su -- omit for all days.
# A task blocks (sleeping in wait increments) until inside a window.
# Set to null or omit for unrestricted (tasks run anytime). No command-line
# override exists for this setting.
exec_window: null
# exec_window: "22:00-06:00 America/Chicago"
# exec_window: "Sa,Su 00:00-00:00 America/Chicago"
# exec_window: "Tu,Th 18:00-06:00 America/Chicago"
# exec_window: "Mo,Tu,We,Th,Fr 17:00-08:00 America/Chicago; Sa,Su 00:00-00:00 America/Chicago"

# ---------------------------------------------------------------------------
# Additional models file (optional)
# Path to a plain-text file with one model ID per line (blank lines and
# lines starting with '#' are ignored). Each ID is registered as a
# self-mapping alias so it can be used verbatim in plan Model: fields.
# Useful for OpenRouter models routed via ANTHROPIC_BASE_URL:
#   e.g. ANTHROPIC_BASE_URL=https://openrouter.ai/api
#        ANTHROPIC_AUTH_TOKEN=<your OpenRouter key>
# Explicit entries in the models dict below override any entry from this file.
# Set to null or omit to skip.
models_file: null
#models_file: /absolute/path/to/models.txt

# ---------------------------------------------------------------------------
# Model ID aliases
# Update these values when new model versions are released.
# Use the keys "haiku", "sonnet", "opus" in plan Model: fields.
# Full provider/model IDs (e.g. nvidia/nemotron-3-super-120b-a12b:free) may
# also be used directly in plan Model: fields without defining an alias here.
# ---------------------------------------------------------------------------
models:
  haiku:  claude-haiku-4-5-20251001
  sonnet: claude-sonnet-4-6
  opus:   claude-opus-4-6
  # Example short aliases for OpenRouter models:
  # nemotron: nvidia/nemotron-3-super-120b-a12b:free
  # qwen3:    qwen/qwen3-coder:free
